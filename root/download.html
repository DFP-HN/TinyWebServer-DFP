<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>文件下载 - TinyWebServer</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }

            .container {
                background: white;
                padding: 40px;
                border-radius: 15px;
                box-shadow: 0 10px 40px rgba(0,0,0,0.2);
                max-width: 900px;
                width: 100%;
            }

            h1 {
                color: #333;
                margin-bottom: 10px;
                text-align: center;
            }

            .subtitle {
                text-align: center;
                color: #666;
                margin-bottom: 30px;
                font-size: 14px;
            }

            .file-list {
                margin-bottom: 30px;
            }

            .file-item {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 15px;
                margin-bottom: 10px;
                border: 2px solid #f0f0f0;
                border-radius: 8px;
                transition: all 0.3s;
                background: #fafafa;
            }

            .file-item:hover {
                border-color: #667eea;
                background: #f5f7ff;
                transform: translateX(5px);
            }

            .file-info {
                display: flex;
                align-items: center;
                flex: 1;
            }

            .file-icon {
                font-size: 32px;
                margin-right: 15px;
            }

            .file-details {
                flex: 1;
            }

            .file-name {
                font-weight: bold;
                color: #333;
                margin-bottom: 5px;
            }

            .file-size {
                color: #999;
                font-size: 12px;
            }

            .file-actions {
                display: flex;
                gap: 10px;
            }

            .download-btn {
                padding: 10px 20px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                border: none;
                border-radius: 8px;
                font-weight: bold;
                cursor: pointer;
                transition: all 0.3s;
                text-decoration: none;
                display: inline-block;
            }

            .download-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            }

            .delete-btn {
                padding: 10px 20px;
                background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
                color: white;
                border: none;
                border-radius: 8px;
                font-weight: bold;
                cursor: pointer;
                transition: all 0.3s;
            }

            .delete-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
            }

            .back-btn {
                display: block;
                width: 100%;
                padding: 15px;
                background: #f0f0f0;
                color: #333;
                border: none;
                border-radius: 8px;
                font-size: 16px;
                font-weight: bold;
                cursor: pointer;
                text-decoration: none;
                text-align: center;
                transition: all 0.3s;
            }

            .back-btn:hover {
                background: #e0e0e0;
            }

            .empty-message {
                text-align: center;
                padding: 40px;
                color: #999;
            }

            .loading {
                text-align: center;
                padding: 40px;
                color: #667eea;
            }

            .error-message {
                text-align: center;
                padding: 20px;
                background: #ffe6e6;
                border: 2px solid #ff6b6b;
                border-radius: 8px;
                color: #d63031;
                margin-bottom: 20px;
            }

            .stats {
                text-align: center;
                margin-bottom: 20px;
                color: #666;
                font-size: 14px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>📥 文件下载中心</h1>
            <p class="subtitle">支持断点续传 | 高速下载 | 动态管理</p>

            <div class="stats" id="fileStats"></div>

            <div class="file-list" id="fileList">
                <div class="loading">正在加载文件列表...</div>
            </div>

            <a href="/" class="back-btn">返回首页</a>
        </div>

        <script>
            // 全局变量
            let currentFiles = [];

            // 文件图标映射
            function getFileIcon(filename) {
                const ext = filename.split('.').pop().toLowerCase();
                const iconMap = {
                    'pdf': '📄',
                    'doc': '📝', 'docx': '📝',
                    'xls': '📊', 'xlsx': '📊',
                    'ppt': '📊', 'pptx': '📊',
                    'txt': '📃',
                    'zip': '📦', 'rar': '📦', 'tar': '📦', 'gz': '📦',
                    'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️',
                    'mp3': '🎵', 'wav': '🎵',
                    'mp4': '🎬', 'avi': '🎬', 'mov': '🎬',
                    'html': '🌐', 'htm': '🌐',
                    'js': '📜', 'css': '📜', 'json': '📜',
                    'bin': '⚙️'
                };
                return iconMap[ext] || '📁';
            }

            // 格式化文件大小
            function formatFileSize(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            // 格式化时间
            function formatTime(timestamp) {
                const date = new Date(timestamp * 1000);
                return date.toLocaleString('zh-CN');
            }

            // 显示错误信息
            function showError(message) {
                const fileListElement = document.getElementById('fileList');
                fileListElement.innerHTML = `
                    <div class="error-message">
                        ❌ ${message}
                    </div>
                `;
            }

            // 加载文件列表
            async function loadFileList() {
                try {
                    const response = await fetch('/api/files');
                    const data = await response.json();

                    if (data.success) {
                        currentFiles = data.files;
                        renderFileList(data.files);
                        updateStats(data.files);
                    } else {
                        showError(data.message || '加载文件列表失败');
                    }
                } catch (error) {
                    console.error('加载文件列表失败:', error);
                    showError('无法连接到服务器：' + error.message);
                }
            }

            // 更新统计信息
            function updateStats(files) {
                const totalSize = files.reduce((sum, file) => sum + file.size, 0);
                const statsElement = document.getElementById('fileStats');
                statsElement.innerHTML = `共 ${files.length} 个文件，总大小 ${formatFileSize(totalSize)}`;
            }

            // 渲染文件列表
            function renderFileList(files) {
                const fileListElement = document.getElementById('fileList');

                if (files.length === 0) {
                    fileListElement.innerHTML = '<div class="empty-message">暂无可下载的文件</div>';
                    return;
                }

                fileListElement.innerHTML = '';

                files.forEach((file, index) => {
                    const fileItem = document.createElement('div');
                    fileItem.className = 'file-item';
                    fileItem.id = `file-${index}`;

                    fileItem.innerHTML = `
                        <div class="file-info">
                            <div class="file-icon">${getFileIcon(file.name)}</div>
                            <div class="file-details">
                                <div class="file-name">${escapeHtml(file.name)}</div>
                                <div class="file-size">${formatFileSize(file.size)} • ${formatTime(file.mtime)}</div>
                            </div>
                        </div>
                        <div class="file-actions">
                            <a href="/download/${encodeURIComponent(file.name)}" class="download-btn" title="下载文件">下载</a>
                            <button class="delete-btn" onclick="deleteFile('${escapeJs(file.name)}', ${index})" title="删除文件">删除</button>
                        </div>
                    `;

                    fileListElement.appendChild(fileItem);
                });
            }

            // HTML转义（防止XSS）
            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // JavaScript字符串转义（防止注入）
            function escapeJs(text) {
                return text.replace(/'/g, "\\'").replace(/"/g, '\\"');
            }

            // 删除文件
            async function deleteFile(filename, index) {
                // 前端确认对话框
                if (!confirm(`确定要删除文件 "${filename}" 吗？\n\n此操作不可恢复！`)) {
                    return;
                }

                try {
                    // 禁用删除按钮（防止重复点击）
                    const fileItem = document.getElementById(`file-${index}`);
                    const deleteBtn = fileItem.querySelector('.delete-btn');
                    deleteBtn.disabled = true;
                    deleteBtn.textContent = '删除中...';

                    // 发送DELETE请求
                    const response = await fetch(`/delete/${encodeURIComponent(filename)}`, {
                        method: 'POST'
                    });

                    const data = await response.json();

                    if (data.success) {
                        alert('✅ 文件删除成功！');
                        // 重新加载文件列表
                        await loadFileList();
                    } else {
                        alert('❌ 删除失败：' + (data.message || '未知错误'));
                        // 恢复按钮状态
                        deleteBtn.disabled = false;
                        deleteBtn.textContent = '删除';
                    }
                } catch (error) {
                    console.error('删除文件失败:', error);
                    alert('❌ 删除失败：' + error.message);
                    // 恢复按钮状态
                    const fileItem = document.getElementById(`file-${index}`);
                    const deleteBtn = fileItem.querySelector('.delete-btn');
                    deleteBtn.disabled = false;
                    deleteBtn.textContent = '删除';
                }
            }

            // 页面加载完成后加载文件列表
            window.addEventListener('DOMContentLoaded', () => {
                loadFileList();
            });

            // 每30秒自动刷新文件列表（可选）
            // setInterval(loadFileList, 30000);
        </script>
    </body>
</html>
