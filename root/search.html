<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>文件搜索 - TinyWebServer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .search-panel {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e0e0e0;
        }

        .search-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-actions {
            grid-column: 1 / -1;
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .results-panel {
            padding: 30px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }

        .results-count {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 18px;
        }

        .error-message {
            background: #ffe6e6;
            border: 2px solid #ff6b6b;
            border-radius: 8px;
            padding: 20px;
            color: #d63031;
            margin: 20px 0;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
        }

        .results-table th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            font-weight: bold;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
        }

        .results-table td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .results-table tr:hover {
            background: #f8f9fa;
        }

        .file-name {
            font-weight: bold;
            color: #333;
        }

        .file-type {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .type-pdf { background: #ff6b6b; color: white; }
        .type-video { background: #4ecdc4; color: white; }
        .type-image { background: #95e1d3; color: white; }
        .type-document { background: #ffeaa7; color: #333; }
        .type-archive { background: #dfe6e9; color: #333; }
        .type-audio { background: #fdcb6e; color: white; }
        .type-other { background: #b2bec3; color: white; }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 13px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: white;
            display: inline-block;
        }

        .btn-download {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-download:hover {
            transform: translateY(-2px);
        }

        .btn-delete {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
        }

        .btn-delete:hover {
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .back-link {
            display: block;
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-top: 2px solid #e0e0e0;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 文件搜索</h1>
            <p>高级搜索 - 支持正则表达式、多条件过滤、自定义排序</p>
        </div>

        <div class="search-panel">
            <form id="searchForm" class="search-form">
                <div class="form-group">
                    <label for="keyword">文件名关键字</label>
                    <input type="text" id="keyword" name="q" placeholder="输入文件名（支持正则）">
                </div>

                <div class="form-group">
                    <label for="fileType">文件类型</label>
                    <select id="fileType" name="file_type">
                        <option value="">全部类型</option>
                        <option value="pdf">PDF文档</option>
                        <option value="video">视频</option>
                        <option value="image">图片</option>
                        <option value="document">文档</option>
                        <option value="archive">压缩包</option>
                        <option value="audio">音频</option>
                        <option value="other">其他</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="extension">文件扩展名</label>
                    <input type="text" id="extension" name="ext" placeholder="如 .pdf, .mp4">
                </div>

                <div class="form-group">
                    <label for="sizeMin">最小大小 (MB)</label>
                    <input type="number" id="sizeMin" name="size_min" placeholder="0" min="0" step="0.1">
                </div>

                <div class="form-group">
                    <label for="sizeMax">最大大小 (MB)</label>
                    <input type="number" id="sizeMax" name="size_max" placeholder="不限" min="0" step="0.1">
                </div>

                <div class="form-group">
                    <label for="sortBy">排序字段</label>
                    <select id="sortBy" name="sort_by">
                        <option value="upload_time">上传时间</option>
                        <option value="filename">文件名</option>
                        <option value="file_size">文件大小</option>
                        <option value="file_type">文件类型</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="sortOrder">排序方向</label>
                    <select id="sortOrder" name="sort_order">
                        <option value="DESC">降序</option>
                        <option value="ASC">升序</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="limit">结果数量</label>
                    <input type="number" id="limit" name="limit" value="50" min="1" max="1000">
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="regexMode" name="regex_mode" value="1">
                    <label for="regexMode">正则表达式模式</label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">🔍 搜索</button>
                    <button type="button" class="btn btn-secondary" onclick="resetForm()">🔄 重置</button>
                </div>
            </form>
        </div>

        <div class="results-panel">
            <div class="results-header">
                <div class="results-count" id="resultsCount">等待搜索...</div>
            </div>
            <div id="resultsContainer"></div>
        </div>

        <div class="back-link">
            <a href="/">← 返回首页</a> | <a href="/download.html">📥 文件下载</a>
        </div>
    </div>

    <script>
        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 格式化时间
        function formatTime(timestamp) {
            const date = new Date(timestamp * 1000);
            return date.toLocaleString('zh-CN');
        }

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 获取文件类型CSS类
        function getTypeClass(type) {
            return 'type-' + (type || 'other');
        }

        // 重置表单
        function resetForm() {
            document.getElementById('searchForm').reset();
            document.getElementById('resultsContainer').innerHTML = '';
            document.getElementById('resultsCount').textContent = '等待搜索...';
        }

        // 删除文件
        async function deleteFile(filename) {
            if (!confirm(`确定要删除文件 "${filename}" 吗？\n\n此操作不可恢复！`)) {
                return;
            }

            try {
                const response = await fetch(`/delete/${encodeURIComponent(filename)}`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.success) {
                    alert('✅ 文件删除成功！');
                    // 重新执行搜索
                    document.getElementById('searchForm').dispatchEvent(new Event('submit'));
                } else {
                    alert('❌ 删除失败：' + (data.message || '未知错误'));
                }
            } catch (error) {
                alert('❌ 删除失败：' + error.message);
            }
        }

        // 渲染搜索结果
        function renderResults(data) {
            const container = document.getElementById('resultsContainer');
            const countElement = document.getElementById('resultsCount');

            if (!data.success) {
                container.innerHTML = `
                    <div class="error-message">
                        ❌ 搜索失败：${escapeHtml(data.message || '未知错误')}
                    </div>
                `;
                countElement.textContent = '搜索失败';
                return;
            }

            countElement.textContent = `找到 ${data.count} 个文件`;

            if (data.count === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                        </svg>
                        <h3>未找到匹配的文件</h3>
                        <p>请尝试调整搜索条件</p>
                    </div>
                `;
                return;
            }

            let html = '<table class="results-table">';
            html += `
                <thead>
                    <tr>
                        <th>文件名</th>
                        <th>类型</th>
                        <th>大小</th>
                        <th>上传时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
            `;

            data.files.forEach(file => {
                html += `
                    <tr>
                        <td class="file-name">${escapeHtml(file.filename)}</td>
                        <td><span class="file-type ${getTypeClass(file.file_type)}">${file.file_type || 'other'}</span></td>
                        <td>${formatFileSize(file.file_size)}</td>
                        <td>${formatTime(file.upload_time)}</td>
                        <td class="action-btns">
                            <a href="/download/${encodeURIComponent(file.filename)}" class="btn-small btn-download">下载</a>
                            <button class="btn-small btn-delete" onclick="deleteFile('${escapeHtml(file.filename).replace(/'/g, "\\'")}')">删除</button>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // 表单提交处理
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const params = new URLSearchParams();

            // 构建查询参数
            for (const [key, value] of formData.entries()) {
                if (value) {
                    // 处理大小单位转换 (MB to bytes)
                    if (key === 'size_min' || key === 'size_max') {
                        const mbValue = parseFloat(value);
                        if (mbValue > 0) {
                            params.append(key, Math.floor(mbValue * 1024 * 1024).toString());
                        }
                    } else {
                        params.append(key, value);
                    }
                }
            }

            // 显示加载状态
            document.getElementById('resultsContainer').innerHTML = '<div class="loading">⏳ 搜索中...</div>';
            document.getElementById('resultsCount').textContent = '搜索中...';

            try {
                const response = await fetch(`/api/search?${params.toString()}`);
                const data = await response.json();
                renderResults(data);
            } catch (error) {
                document.getElementById('resultsContainer').innerHTML = `
                    <div class="error-message">
                        ❌ 搜索请求失败：${error.message}
                    </div>
                `;
                document.getElementById('resultsCount').textContent = '请求失败';
            }
        });

        // 页面加载完成后自动执行一次搜索（显示所有文件）
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('searchForm').dispatchEvent(new Event('submit'));
        });
    </script>
</body>
</html>
