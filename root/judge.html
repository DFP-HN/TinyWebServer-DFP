<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>WebServer</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0;
                padding: 20px;
            }
            .container {
                background: white;
                padding: 40px;
                border-radius: 15px;
                box-shadow: 0 10px 40px rgba(0,0,0,0.2);
                text-align: center;
                max-width: 400px;
                width: 100%;
            }
            h1 {
                color: #333;
                margin-bottom: 30px;
            }
            button {
                width: 100%;
                padding: 15px;
                margin: 10px 0;
                border: none;
                border-radius: 8px;
                font-size: 16px;
                font-weight: bold;
                cursor: pointer;
                transition: all 0.3s;
            }
            .btn-primary {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
            }
            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            }
            .btn-secondary {
                background: #f0f0f0;
                color: #333;
            }
            .btn-secondary:hover {
                background: #e0e0e0;
            }
            .btn-upload {
                background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
                color: white;
            }
            .btn-upload:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>📚 欢迎访问 TinyWebServer</h1>

            <form action="0" method="post">
                <button type="submit" class="btn-primary">新用户注册</button>
            </form>

            <form action="1" method="post">
                <button type="submit" class="btn-primary">已有账号登录</button>
            </form>

            <a href="upload.html" style="text-decoration: none;">
                <button type="button" class="btn-upload">📁 文件上传</button>
            </a>

            <a href="download.html" style="text-decoration: none;">
                <button type="button" class="btn-secondary">📥 文件下载</button>
            </a>

            <p style="margin-top: 30px; color: #666; font-size: 14px;">
                支持1GB+大文件传输 | 断点续传 | 实时进度
            </p>
        </div>
    </body>
</html>
